episodedetails:
  - title: '{title}'
  - showtitle: '{creator}'
  - uniqueid:
      attrs:
        default: 'true'
        type: 'twitchclips'
      value: '{id}'
  - plot: '{fulltitle}'
  - premiered:
      converter:
        data_type: 'date'
        input_format: '%Y%m%d'
        output_format: '%Y-%m-%d'
      value: '{upload_date}'
