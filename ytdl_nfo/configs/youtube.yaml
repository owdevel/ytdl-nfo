episodedetails:
  - title: '{title}'
  - showtitle: '{uploader}'
  - studio: '{uploader}'
  - uniqueid:
      attr:
        type: 'youtube'
        default: "true"
      value: '{id}'
  - plot: '{description}'
  - premiered:
      convert: 'date'
      input_f: '%Y%m%d'
      output_f: '%Y-%m-%d'
      value: '{upload_date}'
  - runtime: '{duration}'
  - ratings>rating>value:
      parent_attr:
        name: 'default'
        max: '10'
        default: 'true'
      value: '{rating}'
  - ratings>rating>votes: '{like_count}'
  - userrating: '{userrating}'
  - thumb: '{thumbnail}'
  - thumb:
      attr:
        aspect: 'poster'
      value: '{thumbnail}'
  - thumb:
      attr:
        aspect: 'thumb'
      value: '{thumbnail}'
  - fileinfo>streamdetails>audio>language: '{audio_language}'
  - fileinfo>streamdetails>video>durationinseconds: '{duration}'
  - genre!: '{categories}'
  - tag!: '{tags}'
